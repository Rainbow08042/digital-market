worker_processes 1;
pid /run/digital-market/nginx.pid;
lock_file /run/digital-market/nginx.lock;
error_log stderr warn;

events {
    worker_connections 512;
}

http {
    include /etc/digital-market/mime.types;
    default_type application/octet-stream;
    charset utf-8;
    server_tokens off;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 30;
    client_max_body_size 1m;
    client_body_temp_path /run/digital-market/client_temp;
    proxy_temp_path /run/digital-market/proxy_temp;
    fastcgi_temp_path /run/digital-market/fastcgi_temp;
    uwsgi_temp_path /run/digital-market/uwsgi_temp;
    scgi_temp_path /run/digital-market/scgi_temp;

    access_log /var/log/digital-market/access.log combined buffer=16k flush=5s;
    gzip on;
    gzip_static on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_comp_level 5;
    gzip_types text/css application/javascript application/json image/svg+xml;

    server {
        listen 8088;
        server_name _;
        root /srv/digital-market/current;
        index index.html;
        autoindex off;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;

        location = /index.html {
            add_header Cache-Control "no-cache" always;
            add_header X-Content-Type-Options nosniff always;
        }
        location ^~ /assets/ {
            try_files $uri =404;
            expires 365d;
        }
        location ^~ /fonts/ {
            try_files $uri =404;
            expires 1d;
        }
        location ^~ /media/ {
            try_files $uri =404;
            expires 1h;
        }
        location ~ /\. {
            deny all;
        }
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
